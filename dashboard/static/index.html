        activeTab: 'pipeline',
        systemStatus: {},
        templates: [],
        projects: [],
        accounts: [],
        activeAccount: null,
        showAccountsModal: false,
        showTokenInput: false,
        isAddingAccount: false,
        testingAccountLogin: null,
        newAccountForm: {
          token: '',
          label: '',
          set_active: true
        },
        showEngineModal: false,
        engineConfig: {},
        engineForm: {
          mode: 'local',
          local_base_url: 'http://127.0.0.1:8000',
          local_api_key: '',
          cloud_base_url: 'https://app.all-hands.dev',
          cloud_api_key: ''
        },
        isTestingEngine: false,
        showConsoleDrawer: false,
        openhandsConversations: [],
        activeConversationId: null,
        activeConversation: null,
        conversationEvents: [],
        isEventsLoading: false,
        isSendingChat: false,
        isInterrupting: false,
        chatInput: '',
        consolePollTimer: null,
        selectedRepo: 'ali-ahadi1105/notion-test',
        pipelineData: {},
        isLaunching: false,
        isPipelineLoading: false,
        isActionLoading: false,
        showTrackModal: false,
        trackRepoInput: '',
        toasts: [],
        launchForm: {
          repo_name: '',
          spec_text: '',
          account_login: '',
          is_private: false,
          create_github_repo: true,
          install_orchestrator: true,
          enable_stations: true
        },

        // Theme & Language State
        currentTheme: localStorage.getItem('factory_theme') || 'dark',
        currentLang: localStorage.getItem('factory_lang') || 'fa',
        translations: translations,

        t(key, fallback = '') {
          const dict = this.translations[this.currentLang] || this.translations['fa'] || {};
          return dict[key] !== undefined ? dict[key] : (fallback || key);
        },

        toggleTheme() {
          this.currentTheme = this.currentTheme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('factory_theme', this.currentTheme);
          this.applyTheme();
        },

        applyTheme() {
          if (this.currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        },

        toggleLanguage() {
          this.currentLang = this.currentLang === 'fa' ? 'en' : 'fa';
          localStorage.setItem('factory_lang', this.currentLang);
          this.applyLanguage();
        },

        applyLanguage() {
          document.documentElement.lang = this.currentLang;
          document.documentElement.dir = this.currentLang === 'fa' ? 'rtl' : 'ltr';
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        },

        async initApp() {
          this.applyTheme();
          this.applyLanguage();

          await this.fetchStatus();
          await this.fetchAccounts();
          await this.fetchEngineConfig();
          await this.fetchTemplates();
          await this.fetchProjects();
          await this.fetchConversationsList();
          if (this.projects.length > 0) {
            this.selectedRepo = this.projects[0].repo;
            await this.fetchPipeline(this.selectedRepo);
          }
          this.$nextTick(() => lucide.createIcons());

          setInterval(() => {
            if (this.activeTab === 'pipeline' && this.selectedRepo) {
              this.fetchPipeline(this.selectedRepo, true);
            }
          }, 15000);
        },

        showToast(message, type = 'info', icon = 'info') {
          const id = Date.now();
          this.toasts.push({ id, message, type, icon });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 4500);
        },

        async fetchStatus() {
          try {
            const res = await fetch('/api/system/status');
            this.systemStatus = await res.json();
          } catch (e) {
            console.error('System status fetch failed', e);
          }
        },

        openAccountsModal() {
          this.showAccountsModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        selectAccountForLaunch(login) {
          this.launchForm.account_login = login;
          this.$nextTick(() => lucide.createIcons());
        },

        async fetchAccounts() {
          try {
            const res = await fetch('/api/accounts');
            this.accounts = await res.json();
            this.activeAccount = this.accounts.find(a => a.is_active) || this.accounts[0] || null;
            if (this.activeAccount && !this.launchForm.account_login) {
              this.launchForm.account_login = this.activeAccount.login;
            }
          } catch (e) {
            console.error('Accounts fetch failed', e);
          } finally {
            this.$nextTick(() => lucide.createIcons());
          }
        },

        async addAccount() {
          if (!this.newAccountForm.token || !this.newAccountForm.token.trim()) {
            this.showToast(this.currentLang === 'fa' ? 'لطفاً توکن گیت‌هاب را وارد کنید' : 'Please enter GitHub PAT', 'error', 'alert-circle');
            return;
          }
          this.isAddingAccount = true;
          try {
            const res = await fetch('/api/accounts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.newAccountForm)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Failed to add account');

            this.showToast(this.currentLang === 'fa' ? `اکانت @${data.login} با موفقیت افزوده شد` : `Account @${data.login} added successfully`, 'success', 'check-circle');
            this.newAccountForm.token = '';
            this.newAccountForm.label = '';
            await this.fetchAccounts();
            await this.fetchStatus();
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.isAddingAccount = false;
          }
        },

        async activateAccount(login) {
          try {
            const res = await fetch(`/api/accounts/${login}/activate`, { method: 'POST' });
            if (!res.ok) throw new Error('Activation failed');
            this.showToast(this.currentLang === 'fa' ? `اکانت @${login} فعال شد` : `Account @${login} set as active`, 'success', 'check');
            await this.fetchAccounts();
            await this.fetchStatus();
            if (this.selectedRepo) {
              await this.fetchPipeline(this.selectedRepo);
            }
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          }
        },

        async testAccount(login) {
          this.testingAccountLogin = login;
          try {
            const res = await fetch(`/api/accounts/${login}/test`, { method: 'POST' });
            const data = await res.json();
            if (data.valid) {
              this.showToast(this.currentLang === 'fa' ? `توکن معتبر است (@${data.login})` : `Token is valid (@${data.login})`, 'success', 'check-circle');
            } else {
              this.showToast(this.currentLang === 'fa' ? `توکن نامعتبر است: ${data.error}` : `Invalid token: ${data.error}`, 'error', 'alert-circle');
            }
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.testingAccountLogin = null;
          }
        },

        async deleteAccount(login) {
          if (!confirm(this.currentLang === 'fa' ? `آیا از حذف اکانت @${login} مطمئن هستید؟` : `Are you sure you want to delete @${login}?`)) return;
          try {
            const res = await fetch(`/api/accounts/${login}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Deletion failed');
            this.showToast(this.currentLang === 'fa' ? `اکانت @${login} حذف شد` : `Account @${login} deleted`, 'info', 'trash-2');
            await this.fetchAccounts();
            await this.fetchStatus();
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          }
        },

        openEngineModal() {
          this.showEngineModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async fetchEngineConfig() {
          try {
            const res = await fetch('/api/openhands/config');
            this.engineConfig = await res.json();
            this.engineForm.mode = this.engineConfig.mode || 'local';
            this.engineForm.local_base_url = this.engineConfig.local?.base_url || 'http://127.0.0.1:8000';
            this.engineForm.local_api_key = this.engineConfig.local?.api_key || '';
            this.engineForm.cloud_base_url = this.engineConfig.cloud?.base_url || 'https://app.all-hands.dev';
            this.engineForm.cloud_api_key = this.engineConfig.cloud?.api_key || '';
          } catch (e) {
            console.error('Engine config fetch failed', e);
          } finally {
            this.$nextTick(() => lucide.createIcons());
          }
        },

        async saveEngineConfig() {
          try {
            const payload = {
              mode: this.engineForm.mode,
              local: {
                base_url: this.engineForm.local_base_url,
                api_key: this.engineForm.local_api_key
              },
              cloud: {
                base_url: this.engineForm.cloud_base_url,
                api_key: this.engineForm.cloud_api_key
              }
            };
            const res = await fetch('/api/openhands/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Saving engine config failed');
            this.engineConfig = await res.json();
            this.showToast(this.currentLang === 'fa' ? 'تنظیمات موتور با موفقیت ذخیره شد' : 'Engine settings saved successfully', 'success', 'check-circle');
            this.showEngineModal = false;
            await this.fetchStatus();
            await this.fetchConversationsList();
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          }
        },

        async testEngineConnection() {
          this.isTestingEngine = true;
          try {
            const targetUrl = this.engineForm.mode === 'cloud' ? this.engineForm.cloud_base_url : this.engineForm.local_base_url;
            const res = await fetch('/api/openhands/conversations?limit=1');
            const data = await res.json();
            if (data.status === 'error') {
              this.showToast(this.currentLang === 'fa' ? `اتصال ناموفق بود: ${data.message}` : `Connection failed: ${data.message}`, 'error', 'alert-circle');
            } else {
              this.showToast(this.currentLang === 'fa' ? `اتصال موفق به ${targetUrl}` : `Successfully connected to ${targetUrl}`, 'success', 'check-circle');
            }
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.isTestingEngine = false;
          }
        },

        async fetchTemplates() {
          try {
            const res = await fetch('/api/templates');
            this.templates = await res.json();
          } catch (e) {
            console.error('Templates fetch failed', e);
          }
        },

        applyTemplate(tmpl) {
          this.launchForm.repo_name = tmpl.id;
          this.launchForm.spec_text = tmpl.spec;
          this.showToast(this.currentLang === 'fa' ? `قالب "${tmpl.title}" بارگذاری شد` : `Template "${tmpl.title}" applied`, 'info', 'check');
        },

        async fetchProjects() {
          try {
            const res = await fetch('/api/projects');
            this.projects = await res.json();
          } catch (e) {
            console.error('Projects fetch failed', e);
          }
        },

        selectProject(repo) {
          this.selectedRepo = repo;
          this.activeTab = 'pipeline';
          this.fetchPipeline(repo);
        },

        async fetchPipeline(repo, silent = false) {
          if (!silent) this.isPipelineLoading = true;
          try {
            const res = await fetch(`/api/pipeline/${repo}`);
            if (res.ok) {
              this.pipelineData = await res.json();
            }
          } catch (e) {
            if (!silent) this.showToast(e.message, 'error');
          } finally {
            if (!silent) this.isPipelineLoading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        refreshCurrentPipeline() {
          if (this.selectedRepo) {
            this.fetchPipeline(this.selectedRepo);
          }
        },

        async launchProject() {
          this.isLaunching = true;
          try {
            const res = await fetch('/api/launch', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.launchForm)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Launch failed');

            this.showToast(this.currentLang === 'fa' ? `پروژه ${data.repo} با موفقیت راه‌اندازی شد!` : `Project ${data.repo} launched successfully!`, 'success', 'rocket');
            await this.fetchProjects();
            this.selectedRepo = data.repo;
            this.activeTab = 'pipeline';
            await this.fetchPipeline(this.selectedRepo);
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.isLaunching = false;
          }
        },

        async triggerOrchestrate() {
          this.isActionLoading = true;
          try {
            const res = await fetch(`/api/pipeline/${this.selectedRepo}/orchestrate`, { method: 'POST' });
            const data = await res.json();
            this.showToast(this.currentLang === 'fa' ? `ارکستریتور اجرا شد: ${data.message || 'عملیات با موفقیت انجام شد'}` : `Orchestrator triggered: ${data.message || 'Success'}`, 'info', 'play');
            await this.fetchPipeline(this.selectedRepo);
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.isActionLoading = false;
          }
        },

        async triggerHealer() {
          this.isActionLoading = true;
          try {
            const res = await fetch(`/api/pipeline/${this.selectedRepo}/heal`, { method: 'POST' });
            const data = await res.json();
            this.showToast(this.currentLang === 'fa' ? `سیستم ترمیم اجرا شد: ${data.message || 'بررسی وضعیت انجام شد'}` : `Healer executed: ${data.message || 'Health check complete'}`, 'info', 'shield-check');
            await this.fetchPipeline(this.selectedRepo);
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.isActionLoading = false;
          }
        },

        async trackRepo() {
          if (!this.trackRepoInput || !this.trackRepoInput.includes('/')) {
            this.showToast(this.currentLang === 'fa' ? 'لطفاً نام مخزن را در قالب owner/repo وارد کنید' : 'Please enter owner/repo format', 'error');
            return;
          }
          try {
            const res = await fetch('/api/projects/track', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repo: this.trackRepoInput.trim() })
            });
            if (!res.ok) throw new Error('Tracking failed');
            this.showToast(this.currentLang === 'fa' ? 'مخزن با موفقیت اضافه شد' : 'Repository tracked', 'success');
            this.showTrackModal = false;
            this.selectedRepo = this.trackRepoInput.trim();
            this.trackRepoInput = '';
            await this.fetchProjects();
            this.activeTab = 'pipeline';
            await this.fetchPipeline(this.selectedRepo);
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },

        // -------------------------------------------------------------
        // LIVE AGENT CONSOLE & CHAT
        // -------------------------------------------------------------
        async openConsoleDrawer(convId = null) {
          this.showConsoleDrawer = true;
          await this.fetchConversationsList();
          if (convId) {
            this.activeConversationId = convId;
          } else if (!this.activeConversationId && this.openhandsConversations.length > 0) {
            this.activeConversationId = this.openhandsConversations[0].id;
          }
          if (this.activeConversationId) {
            await this.selectConversation(this.activeConversationId);
          }
          this.$nextTick(() => lucide.createIcons());

          if (this.consolePollTimer) clearInterval(this.consolePollTimer);
          this.consolePollTimer = setInterval(() => {
            if (this.showConsoleDrawer && this.activeConversationId) {
              this.fetchEvents(this.activeConversationId, true);
            }
          }, 4000);
        },

        closeConsoleDrawer() {
          this.showConsoleDrawer = false;
          if (this.consolePollTimer) {
            clearInterval(this.consolePollTimer);
            this.consolePollTimer = null;
          }
        },

        async fetchConversationsList() {
          try {
            const res = await fetch('/api/openhands/conversations?limit=25');
            const data = await res.json();
            this.openhandsConversations = data.conversations || [];
          } catch (e) {
            console.error('Failed to fetch OpenHands conversations', e);
          }
        },

        async selectConversation(id) {
          this.activeConversationId = id;
          this.activeConversation = this.openhandsConversations.find(c => c.id === id) || null;
          this.conversationEvents = [];
          await this.fetchEvents(id);
        },

        async fetchEvents(convId, silent = false) {
          if (!convId) return;
          if (!silent) this.isEventsLoading = true;
          try {
            const res = await fetch(`/api/openhands/conversations/${convId}/events?limit=100`);
            const data = await res.json();
            if (res.ok) {
              this.conversationEvents = data.events || [];
              if (data.status) {
                if (this.activeConversation) this.activeConversation.status = data.status;
              }
              this.$nextTick(() => {
                const container = document.getElementById('consoleEventsContainer');
                if (container && !silent) {
                  container.scrollTop = container.scrollHeight;
                }
                lucide.createIcons();
              });
            }
          } catch (e) {
            console.error('Fetch events failed', e);
          } finally {
            if (!silent) this.isEventsLoading = false;
          }
        },

        async sendChatMessage() {
          if (!this.chatInput.trim() || !this.activeConversationId) return;
          this.isSendingChat = true;
          const msg = this.chatInput.trim();
          this.chatInput = '';
          try {
            const res = await fetch(`/api/openhands/conversations/${this.activeConversationId}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Failed to send message');
            this.showToast(this.currentLang === 'fa' ? 'پیام به ایجنت ارسال شد' : 'Message sent to agent', 'success', 'send');
            await this.fetchEvents(this.activeConversationId);
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.isSendingChat = false;
          }
        },

        async sendQuickPrompt(promptText) {
          this.chatInput = promptText;
          await this.sendChatMessage();
        },

        async interruptAgent() {
          if (!this.activeConversationId) return;
          this.isInterrupting = true;
          try {
            const res = await fetch(`/api/openhands/conversations/${this.activeConversationId}/interrupt`, {
              method: 'POST'
            });
            if (!res.ok) throw new Error('Interrupt failed');
            this.showToast(this.currentLang === 'fa' ? 'دستور توقف اضطراری ارسال شد' : 'Emergency interrupt sent', 'info', 'octagon-alert');
            await this.fetchEvents(this.activeConversationId);
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          } finally {
            this.isInterrupting = false;
          }
        },

        async resumeAgent() {
          if (!this.activeConversationId) return;
          try {
            const res = await fetch(`/api/openhands/conversations/${this.activeConversationId}/run`, {
              method: 'POST'
            });
            if (!res.ok) throw new Error('Resume failed');
            this.showToast(this.currentLang === 'fa' ? 'حلقه اجرای ایجنت فعال شد' : 'Agent execution resumed', 'success', 'play');
            await this.fetchEvents(this.activeConversationId);
          } catch (e) {
            this.showToast(e.message, 'error', 'alert-triangle');
          }
        },

        getOpenHandsWebUrl(id) {
          if (!id) return '#';
          if (this.engineConfig?.mode === 'cloud') {
            return `https://app.all-hands.dev/conversation/${id}`;
          }
          return `http://127.0.0.1:8000/conversation/${id}`;
        },

        formatTimestamp(ts) {
          if (!ts) return '';
          try {
            const parts = ts.split('T');
            if (parts.length > 1) {
              return parts[1].split('.')[0];
            }
            return ts;
          } catch (e) {
            return '';
          }
        },

        translateStatus(status) {
          if (this.currentLang === 'en') {
            const mapEn = {
              'COMPLETED': 'Completed & Merged',
              'IN_PROGRESS': 'In Progress',
              'HEALING': 'Auto-Healing',
              'ESCALATED': 'Needs Human Review',
              'BLOCKED': 'Blocked',
              'QUEUED': 'Queued'
            };
            return mapEn[status] || status;
          }
          const mapFa = {
            'COMPLETED': 'تکمیل و مرج‌شده',
            'IN_PROGRESS': 'در حال کدنویسی',
            'HEALING': 'در حال ترمیم خودکار',
            'ESCALATED': 'نیازمند بررسی انسانی',
            'BLOCKED': 'قفل (منتظر فاز قبل)',
            'QUEUED': 'در صف اجرا'
          };
          return mapFa[status] || status;
        }
      }
    }
  </script>
</body>
</html>
