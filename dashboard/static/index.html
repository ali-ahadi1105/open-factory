<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenHands Software Factory | کارخانه نرم‌افزار خودکار</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Vazirmatn & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              900: '#0b0f17',
              800: '#111827',
              700: '#1f2937',
              600: '#374151',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Vazirmatn', 'Inter', sans-serif; }
    html[dir="ltr"] body { font-family: 'Inter', 'Vazirmatn', sans-serif; }

    /* Light Theme Glass */
    .glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.04);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* Dark Theme Glass */
    .dark .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }
    .dark .glass-card {
      background: rgba(31, 41, 55, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: none;
    }
    .dark .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 dark:bg-dark-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200" 
      x-data="factoryApp()" x-init="initApp()">

  <!-- Toast Notifications -->
  <div class="fixed top-5 left-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none" dir="ltr">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 border text-sm"
           :class="{
             'bg-emerald-950/90 text-emerald-200 border-emerald-700': toast.type === 'success',
             'bg-rose-950/90 text-rose-200 border-rose-700': toast.type === 'error',
             'bg-indigo-950/90 text-indigo-200 border-indigo-700': toast.type === 'info'
           }">
        <svg x-show="toast.type === 'success'" class="w-5 h-5 shrink-0 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <svg x-show="toast.type === 'error'" class="w-5 h-5 shrink-0 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <svg x-show="toast.type !== 'success' && toast.type !== 'error'" class="w-5 h-5 shrink-0 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <div class="flex-1" x-text="toast.message"></div>
      </div>
    </template>
  </div>

  <!-- Header / Navigation -->
  <header class="glass sticky top-0 z-40 border-b border-slate-200 dark:border-white/10 px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white shrink-0">
          <i data-lucide="cpu" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-lg text-slate-900 dark:text-white" x-text="t('app_title')"></h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 font-medium border border-brand-500/30" x-text="t('app_badge')"></span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('app_subtitle')"></p>
        </div>
      </div>

      <!-- Action Buttons & Switchers -->
      <div class="flex items-center gap-2.5 flex-wrap">
        
        <!-- Language Switcher Button -->
        <button type="button" @click="toggleLanguage()" 
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-slate-200 shadow-sm transition-all cursor-pointer"
                :title="currentLang === 'fa' ? 'Switch to English' : 'تغییر به فارسی'">
          <span class="text-sm" x-text="currentLang === 'fa' ? '🇬🇧' : '🇮🇷'"></span>
          <span x-text="currentLang === 'fa' ? 'English' : 'فارسی'"></span>
        </button>

        <!-- Theme Switcher Button -->
        <button type="button" @click="toggleTheme()" 
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-slate-200 shadow-sm transition-all cursor-pointer select-none"
                :title="currentTheme === 'dark' ? t('switch_to_light') : t('switch_to_dark')">
          <svg x-show="currentTheme === 'dark'" class="w-4 h-4 text-amber-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg x-show="currentTheme === 'light'" class="w-4 h-4 text-indigo-500 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <span x-text="currentTheme === 'dark' ? t('theme_light') : t('theme_dark')"></span>
        </button>

        <!-- GitHub Account Button -->
        <button type="button" @click="openAccountsModal()" 
                class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 hover:border-brand-500/50 text-xs transition-all duration-200 group cursor-pointer shadow-sm">
          <img x-show="activeAccount && activeAccount.avatar_url" :src="activeAccount?.avatar_url || ''" class="w-4 h-4 rounded-full ring-1 ring-slate-200 dark:ring-white/20">
          <svg x-show="!activeAccount || !activeAccount.avatar_url" class="w-4 h-4 text-slate-600 dark:text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full" :class="systemStatus.github?.connected ? 'bg-emerald-500 shadow-sm shadow-emerald-400' : 'bg-rose-500'"></span>
            <span class="font-medium text-slate-700 dark:text-slate-200" x-text="activeAccount ? '@' + activeAccount.login : (systemStatus.github?.user?.login ? '@' + systemStatus.github.user.login : t('connect_github'))"></span>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 border border-brand-500/30" x-text="t('accounts_btn')"></span>
        </button>

        <!-- OpenHands Engine Configuration Button -->
        <button type="button" @click="openEngineModal()"
                class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 hover:border-indigo-500/50 text-xs transition-all duration-200 group cursor-pointer shadow-sm">
          <span class="w-2.5 h-2.5 rounded-full" :class="systemStatus.openhands?.connected ? 'bg-emerald-500 shadow-sm shadow-emerald-400' : 'bg-rose-500'"></span>
          <i data-lucide="bot" class="w-4 h-4 text-slate-600 dark:text-slate-300"></i>
          <div class="flex items-center gap-1.5">
            <span class="font-medium text-slate-700 dark:text-slate-200" x-text="systemStatus.openhands?.mode === 'cloud' ? t('openhands_cloud') : t('openhands_local')"></span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 border border-indigo-500/30" x-text="t('engine_btn')"></span>
          </div>
        </button>

        <!-- Live Agent Console Drawer Button -->
        <button type="button" @click="openConsoleDrawer()"
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white text-xs font-bold transition-all duration-200 shadow-md shadow-indigo-600/20 cursor-pointer">
          <i data-lucide="terminal" class="w-4 h-4"></i>
          <span x-text="t('live_console_btn')"></span>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col gap-6">

    <!-- Navigation Tabs -->
    <div class="flex items-center gap-2 border-b border-slate-200 dark:border-white/10 pb-2">
      <button @click="activeTab = 'launch'" 
              class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200"
              :class="activeTab === 'launch' ? 'bg-brand-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-white/5'">
        <i data-lucide="rocket" class="w-4 h-4"></i>
        <span x-text="t('tab_launch')"></span>
      </button>

      <button @click="activeTab = 'pipeline'; refreshCurrentPipeline()" 
              class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200"
              :class="activeTab === 'pipeline' ? 'bg-brand-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-white/5'">
        <i data-lucide="activity" class="w-4 h-4"></i>
        <span x-text="t('tab_pipeline')"></span>
      </button>

      <button @click="activeTab = 'templates'" 
              class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200"
              :class="activeTab === 'templates' ? 'bg-brand-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-white/5'">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span x-text="t('tab_templates')"></span>
      </button>
    </div>

    <!-- TAB 1: LAUNCH PROJECT -->
    <div x-show="activeTab === 'launch'" x-cloak class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Launch Form (2 Columns) -->
      <div class="lg:col-span-2 flex flex-col gap-5 glass p-6 rounded-2xl">
        <div>
          <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="sparkles" class="w-5 h-5 text-indigo-500 dark:text-indigo-400"></i>
            <span x-text="t('launch_card_title')"></span>
          </h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="t('launch_card_subtitle')"></p>
        </div>

        <!-- Target GitHub Account Selector -->
        <div class="p-4 rounded-xl bg-slate-50 dark:bg-dark-800/60 border border-slate-200 dark:border-white/5 flex flex-col gap-2.5">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-4 h-4 text-brand-600 dark:text-brand-400"></i>
              <span x-text="t('account_label')"></span>
            </label>
            <button type="button" @click="openAccountsModal()" class="text-[11px] text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1 transition">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span x-text="t('add_account_btn')"></span>
            </button>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
            <template x-for="acc in accounts" :key="acc.login">
              <div @click="selectAccountForLaunch(acc.login)"
                   class="p-2.5 rounded-xl border text-xs cursor-pointer flex items-center gap-2.5 transition-all"
                   :class="launchForm.account_login === acc.login 
                     ? 'bg-brand-50 dark:bg-brand-600/20 border-brand-500 text-brand-700 dark:text-white shadow-sm' 
                     : 'bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border-slate-200 dark:border-white/5 text-slate-600 dark:text-slate-400'">
                <img :src="acc.avatar_url" class="w-6 h-6 rounded-full shrink-0 border border-slate-200 dark:border-white/10">
                <div class="flex-1 min-w-0">
                  <div class="font-bold truncate text-slate-900 dark:text-white" x-text="'@' + acc.login"></div>
                  <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate" x-text="acc.label || acc.name"></div>
                </div>
                <svg x-show="launchForm.account_login === acc.login" class="w-4 h-4 text-brand-600 dark:text-brand-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>
            </template>
          </div>
        </div>

        <!-- Repository Name & Visibility -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5" x-text="t('repo_name_label')"></label>
            <div class="relative flex items-center" dir="ltr">
              <span class="absolute left-3 text-xs text-slate-400 dark:text-slate-500 select-none font-mono" x-text="(launchForm.account_login || (activeAccount ? activeAccount.login : (systemStatus.github?.user?.login || 'owner'))) + '/'"></span>
              <input type="text" x-model="launchForm.repo_name" 
                     :placeholder="t('repo_name_placeholder')" 
                     class="w-full bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-xl py-2.5 pr-4 pl-36 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors shadow-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5" x-text="t('visibility_label')"></label>
            <div class="flex items-center gap-2 bg-white dark:bg-dark-800 p-1.5 rounded-xl border border-slate-200 dark:border-white/10 shadow-sm">
              <button type="button" @click="launchForm.is_private = false" 
                      class="flex-1 py-1.5 rounded-lg text-xs font-medium transition"
                      :class="!launchForm.is_private ? 'bg-brand-600 text-white' : 'text-slate-500 dark:text-slate-400'"
                      x-text="t('visibility_public')"></button>
              <button type="button" @click="launchForm.is_private = true" 
                      class="flex-1 py-1.5 rounded-lg text-xs font-medium transition"
                      :class="launchForm.is_private ? 'bg-brand-600 text-white' : 'text-slate-500 dark:text-slate-400'"
                      x-text="t('visibility_private')"></button>
            </div>
          </div>
        </div>

        <!-- Template Fast-Pills -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5" x-text="t('quick_templates_label')"></label>
          <div class="flex flex-wrap gap-2">
            <template x-for="tmpl in templates" :key="tmpl.id">
              <button type="button" @click="applyTemplate(tmpl)" 
                      class="px-3 py-1.5 rounded-lg bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 text-xs text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition shadow-sm">
                <i data-lucide="copy" class="w-3.5 h-3.5 text-indigo-500 dark:text-indigo-400"></i>
                <span x-text="tmpl.title"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- Specification Editor -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300" x-text="t('spec_label')"></label>
            <span class="text-[11px] text-slate-400 dark:text-slate-500 font-mono">## Phase 1: Title</span>
          </div>
          <textarea x-model="launchForm.spec_text" rows="12" dir="ltr"
                    :placeholder="t('spec_placeholder')"
                    class="w-full bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-xl p-4 font-mono text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-brand-500 transition-colors leading-relaxed shadow-sm"></textarea>
        </div>

        <!-- Automation Checkboxes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 border-t border-slate-200 dark:border-white/5">
          <label class="flex items-center gap-2.5 text-xs text-slate-700 dark:text-slate-300 cursor-pointer">
            <input type="checkbox" x-model="launchForm.create_github_repo" class="rounded bg-slate-50 dark:bg-dark-800 border-slate-300 dark:border-white/20 text-brand-600 focus:ring-0 w-4 h-4">
            <span x-text="t('create_repo_checkbox')"></span>
          </label>
          <label class="flex items-center gap-2.5 text-xs text-slate-700 dark:text-slate-300 cursor-pointer">
            <input type="checkbox" x-model="launchForm.install_orchestrator" class="rounded bg-slate-50 dark:bg-dark-800 border-slate-300 dark:border-white/20 text-brand-600 focus:ring-0 w-4 h-4">
            <span x-text="t('install_orchestrator_checkbox')"></span>
          </label>
        </div>

        <!-- Submit Button -->
        <button @click="launchProject()" :disabled="isLaunching || !launchForm.repo_name || !launchForm.spec_text"
                class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-500 hover:from-brand-500 hover:to-indigo-400 text-white font-bold text-sm shadow-xl shadow-indigo-600/25 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300">
          <svg x-show="!isLaunching" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
          </svg>
          <div x-show="isLaunching" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span x-text="isLaunching ? t('launching_btn') : t('launch_btn')"></span>
        </button>

      </div>

      <!-- Quick Info / Workflow Explainer (1 Column) -->
      <div class="flex flex-col gap-4">
        
        <div class="glass p-5 rounded-2xl flex flex-col gap-4">
          <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="workflow" class="w-4 h-4 text-emerald-500"></i>
            <span x-text="t('guide_title')"></span>
          </h3>
          <ul class="flex flex-col gap-3 text-xs text-slate-600 dark:text-slate-300">
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 flex items-center justify-center shrink-0 font-bold text-[10px]">۱</span>
              <div><strong x-text="t('guide_step1_title')"></strong> <span x-text="t('guide_step1_desc')"></span></div>
            </li>
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 flex items-center justify-center shrink-0 font-bold text-[10px]">۲</span>
              <div><strong x-text="t('guide_step2_title')"></strong> <span x-text="t('guide_step2_desc')"></span></div>
            </li>
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 flex items-center justify-center shrink-0 font-bold text-[10px]">۳</span>
              <div><strong x-text="t('guide_step3_title')"></strong> <span x-text="t('guide_step3_desc')"></span></div>
            </li>
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-brand-500/10 dark:bg-brand-500/20 text-brand-600 dark:text-brand-300 flex items-center justify-center shrink-0 font-bold text-[10px]">۴</span>
              <div><strong x-text="t('guide_step4_title')"></strong> <span x-text="t('guide_step4_desc')"></span></div>
            </li>
          </ul>
        </div>

        <!-- Tracked Repos List Box -->
        <div class="glass p-5 rounded-2xl flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
              <i data-lucide="folder-git-2" class="w-4 h-4 text-indigo-500 dark:text-indigo-400"></i>
              <span x-text="t('tracked_projects_title')"></span>
            </h3>
            <button @click="showTrackModal = true" class="text-xs text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span x-text="t('add_repo_btn')"></span>
            </button>
          </div>
          <div class="flex flex-col gap-2 max-h-56 overflow-y-auto">
            <template x-for="p in projects" :key="p.repo">
              <div @click="selectProject(p.repo)" 
                   class="p-2.5 rounded-xl bg-white dark:bg-dark-800/80 hover:bg-slate-50 dark:hover:bg-dark-700/80 border border-slate-200 dark:border-white/5 cursor-pointer transition flex items-center justify-between shadow-sm">
                <div>
                  <div class="font-semibold text-xs text-slate-900 dark:text-white" x-text="p.name"></div>
                  <div class="text-[11px] text-slate-500 dark:text-slate-400" x-text="p.repo"></div>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 font-mono" x-text="p.progress_percent + '%'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

      </div>

    </div>

    <!-- TAB 2: PIPELINE & LIVE GRAPH -->
    <div x-show="activeTab === 'pipeline'" x-cloak class="flex flex-col gap-6">
      
      <!-- Top Project Selector & Action Bar -->
      <div class="glass p-5 rounded-2xl flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-500 dark:text-indigo-400 shrink-0">
            <i data-lucide="git-branch" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <select x-model="selectedRepo" @change="fetchPipeline(selectedRepo)" 
                      class="bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm" dir="ltr">
                <template x-for="p in projects" :key="p.repo">
                  <option :value="p.repo" x-text="p.repo"></option>
                </template>
              </select>
              <a :href="'https://github.com/' + selectedRepo" target="_blank" class="text-slate-400 hover:text-slate-900 dark:hover:text-white p-1 rounded-lg">
                <i data-lucide="external-link" class="w-4 h-4"></i>
              </a>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="t('pipeline_subtitle')"></p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2.5 flex-wrap">
          <button @click="triggerOrchestrate()" :disabled="isActionLoading" 
                  class="px-3 py-2 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 transition shadow-sm">
            <i data-lucide="play" class="w-4 h-4 text-emerald-500"></i>
            <span x-text="t('orchestrate_btn')"></span>
          </button>

          <button @click="triggerHealer()" :disabled="isActionLoading" 
                  class="px-3 py-2 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 transition shadow-sm">
            <i data-lucide="shield-check" class="w-4 h-4 text-amber-500"></i>
            <span x-text="t('healer_btn')"></span>
          </button>

          <button @click="fetchPipeline(selectedRepo)" 
                  class="p-2 rounded-xl bg-white dark:bg-dark-800 hover:bg-slate-50 dark:hover:bg-dark-700 border border-slate-200 dark:border-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition shadow-sm">
            <i data-lucide="refresh-cw" class="w-4 h-4" :class="isPipelineLoading ? 'animate-spin text-brand-500' : ''"></i>
          </button>
        </div>
      </div>

      <!-- Pipeline Progress Bar -->
      <div class="glass p-5 rounded-2xl flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-slate-700 dark:text-slate-300" x-text="t('pipeline_progress_title')"></span>
          <span class="font-mono font-bold text-brand-600 dark:text-brand-400" x-text="pipelineData.progress_percent + '% (' + (pipelineData.completed_phases || 0) + ' / ' + (pipelineData.total_phases || 0) + ')'"></span>
        </div>
        <div class="w-full h-3 rounded-full bg-slate-200 dark:bg-dark-800 border border-slate-300 dark:border-white/5 overflow-hidden">
          <div class="h-full bg-gradient-to-r from-brand-600 via-indigo-500 to-emerald-400 transition-all duration-500 rounded-full"
               :style="'width: ' + (pipelineData.progress_percent || 0) + '%'"></div>
        </div>
      </div>

      <!-- Phase Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <template x-for="phase in (pipelineData.phases || [])" :key="phase.issue_number">
          <div class="glass-card p-5 rounded-2xl flex flex-col justify-between gap-4 transition-all duration-300 relative overflow-hidden"
               :class="{
                 'border-emerald-500/40 bg-emerald-50/50 dark:bg-emerald-950/10': phase.status === 'COMPLETED',
                 'border-indigo-500/50 bg-indigo-50/60 dark:bg-indigo-950/20 shadow-lg shadow-indigo-500/10': phase.status === 'IN_PROGRESS',
                 'border-amber-500/40 bg-amber-50/50 dark:bg-amber-950/10': phase.status === 'HEALING',
                 'border-rose-500/40 bg-rose-50/50 dark:bg-rose-950/10': phase.status === 'ESCALATED',
                 'border-slate-200 dark:border-white/5 opacity-70': phase.status === 'BLOCKED'
               }">
            
            <div>
              <!-- Header: Phase Number & Status Badge -->
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-mono font-bold text-brand-600 dark:text-brand-400 px-2 py-0.5 rounded-md bg-brand-500/10 border border-brand-500/20"
                      x-text="t('phase_label') + ' ' + phase.phase"></span>
                
                <!-- Status Badge -->
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full"
                      :class="{
                        'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30': phase.status === 'COMPLETED',
                        'bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border border-indigo-500/30 animate-pulse': phase.status === 'IN_PROGRESS',
                        'bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/30': phase.status === 'HEALING',
                        'bg-rose-500/20 text-rose-700 dark:text-rose-300 border border-rose-500/30': phase.status === 'ESCALATED',
                        'bg-slate-200 dark:bg-slate-700/40 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-600/30': phase.status === 'BLOCKED'
                      }"
                      x-text="translateStatus(phase.status)"></span>
              </div>

              <!-- Phase Title -->
              <h4 class="font-bold text-sm text-slate-900 dark:text-white mb-2 line-clamp-2" x-text="phase.title"></h4>

              <!-- Issue Link -->
              <a :href="phase.url" target="_blank" class="inline-flex items-center gap-1 text-xs text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-300 transition">
                <i data-lucide="circle-dot" class="w-3.5 h-3.5"></i>
                <span x-text="'Issue #' + phase.issue_number"></span>
              </a>
            </div>

            <!-- Footer: PR & Blocker Details -->
            <div class="pt-3 border-t border-slate-200 dark:border-white/5 flex flex-col gap-2 text-xs">
              <!-- PR Status if exists -->
              <template x-if="phase.pr">
                <div class="flex items-center justify-between bg-slate-50 dark:bg-dark-800/60 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-white/5">
                  <a :href="phase.pr.html_url" target="_blank" class="flex items-center gap-1 font-mono font-semibold text-indigo-600 dark:text-indigo-300 hover:underline">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <circle cx="18" cy="18" r="3"></circle>
                      <circle cx="6" cy="6" r="3"></circle>
                      <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
                      <line x1="6" y1="9" x2="6" y2="21"></line>
                    </svg>
                    <span x-text="'PR #' + phase.pr.number"></span>
                  </a>
                  <span class="text-[10px] uppercase font-bold"
                        :class="phase.pr.state === 'closed' ? 'text-emerald-500' : 'text-indigo-500'"
                        x-text="phase.pr.state === 'closed' ? 'MERGED' : 'OPEN'"></span>
                </div>
              </template>

              <!-- Blockers info -->
              <template x-if="phase.blockers && phase.blockers.length > 0 && !phase.is_closed">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-1">
                  <svg class="w-3 h-3 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <span><span x-text="t('phase_blocked_by')"></span> <span class="font-mono text-amber-600 dark:text-amber-300" x-text="phase.blockers.map(b => '#' + b).join(', ')"></span></span>
                </div>
              </template>

              <!-- Completed badge -->
              <template x-if="phase.is_closed">
                <div class="text-[11px] text-emerald-600 dark:text-emerald-400 flex items-center gap-1 font-semibold">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M18 6 7 17l-5-5"></path>
                    <path d="m22 10-7.5 7.5L13 16"></path>
                  </svg>
                  <span x-text="t('phase_completed_msg')"></span>
                </div>
              </template>

              <!-- Live Agent Console Button -->
              <template x-if="phase.is_active || phase.conversation_id || phase.status === 'IN_PROGRESS' || phase.status === 'HEALING'">
                <button type="button" @click="openConsoleDrawer(phase.conversation_id)"
                        class="w-full mt-2 py-2 px-3 rounded-xl bg-indigo-600/10 dark:bg-indigo-600/20 hover:bg-indigo-600 dark:hover:bg-indigo-600/40 border border-indigo-500/30 text-indigo-700 dark:text-indigo-200 hover:text-white text-xs font-bold flex items-center justify-center gap-1.5 transition shadow-sm">
                  <svg class="w-3.5 h-3.5 text-indigo-500 dark:text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                  </svg>
                  <span x-text="t('phase_console_btn')"></span>
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                </button>
              </template>
            </div>

          </div>
        </template>
      </div>

    </div>

    <!-- TAB 3: TEMPLATES -->
    <div x-show="activeTab === 'templates'" x-cloak class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <template x-for="tmpl in templates" :key="tmpl.id">
        <div class="glass p-6 rounded-2xl flex flex-col justify-between gap-4 border border-slate-200 dark:border-white/5 hover:border-brand-500/40 transition-all duration-300 shadow-sm">
          <div>
            <div class="w-12 h-12 rounded-xl bg-brand-500/10 border border-brand-500/20 text-brand-600 dark:text-brand-400 flex items-center justify-center mb-4">
              <i :data-lucide="tmpl.icon || 'code'" class="w-6 h-6"></i>
            </div>
            <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-dark-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-white/5" x-text="tmpl.category"></span>
            <h3 class="font-bold text-base text-slate-900 dark:text-white mt-2 mb-1" x-text="tmpl.title"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed" x-text="tmpl.description"></p>
          </div>

          <button @click="applyTemplate(tmpl); activeTab = 'launch'" 
                  class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-dark-800 hover:bg-brand-600 text-slate-700 dark:text-slate-200 hover:text-white text-xs font-semibold border border-slate-200 dark:border-white/10 transition-colors flex items-center justify-center gap-1.5 shadow-sm">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
            <span x-text="t('use_template_btn')"></span>
          </button>
        </div>
      </template>
    </div>

  </main>

  <!-- Track Modal -->
  <div x-show="showTrackModal" x-cloak class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass max-w-md w-full p-6 rounded-2xl flex flex-col gap-4 border border-slate-200 dark:border-white/10 shadow-2xl" @click.outside="showTrackModal = false">
      <h3 class="font-bold text-base text-slate-900 dark:text-white" x-text="t('track_modal_title')"></h3>
      <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('track_modal_desc')"></p>
      <input type="text" x-model="trackRepoInput" :placeholder="t('track_repo_placeholder')" dir="ltr"
             class="w-full bg-white dark:bg-dark-800 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
      <div class="flex items-center gap-2 justify-end">
        <button @click="showTrackModal = false" class="px-4 py-2 rounded-xl text-xs text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" x-text="t('cancel_btn')"></button>
        <button @click="trackRepo()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold" x-text="t('track_submit_btn')"></button>
      </div>
    </div>
  </div>

  <!-- Accounts Management Modal -->
  <div x-show="showAccountsModal" x-cloak class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
    <div class="glass max-w-2xl w-full p-6 rounded-2xl flex flex-col gap-5 border border-slate-200 dark:border-white/10 my-8 shadow-2xl" @click.outside="showAccountsModal = false">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-white/10 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-brand-600/10 dark:bg-brand-600/20 text-brand-600 dark:text-brand-400 flex items-center justify-center border border-brand-500/30 shrink-0">
            <i data-lucide="github" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-900 dark:text-white" x-text="t('accounts_modal_title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('accounts_modal_desc')"></p>
          </div>
        </div>
        <button @click="showAccountsModal = false" class="text-slate-400 hover:text-slate-900 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Configured Accounts List -->
      <div class="flex flex-col gap-3">
        <label class="text-xs font-semibold text-slate-700 dark:text-slate-300" x-text="t('connected_accounts_label')"></label>
        <div class="flex flex-col gap-2 max-h-56 overflow-y-auto pr-1">
          <template x-for="acc in accounts" :key="acc.login">
            <div class="p-3 rounded-xl bg-white dark:bg-dark-800/80 border border-slate-200 dark:border-white/10 flex items-center justify-between gap-3 flex-wrap shadow-sm">
              <div class="flex items-center gap-3">
                <img :src="acc.avatar_url" class="w-9 h-9 rounded-full border border-slate-200 dark:border-white/10 shrink-0">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900 dark:text-white" x-text="'@' + acc.login"></span>
                    <template x-if="acc.is_active">
                      <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-semibold border border-emerald-500/30 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span x-text="t('active_account_badge')"></span>
                      </span>
                    </template>
                  </div>
                  <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                    <span x-text="acc.name"></span>
                    <span>•</span>
                    <span class="font-mono text-[11px] text-slate-400 dark:text-slate-500" x-text="acc.masked_token"></span>
                    <template x-if="acc.label">
                      <span class="px-1.5 py-0.2 rounded bg-slate-100 dark:bg-dark-700 text-[10px] text-slate-600 dark:text-slate-300" x-text="acc.label"></span>
                    </template>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button type="button" @click="testAccount(acc.login)" :disabled="testingAccountLogin === acc.login"
                        class="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-dark-700 hover:bg-slate-200 dark:hover:bg-dark-600 text-xs text-slate-700 dark:text-slate-300 flex items-center gap-1 transition">
                  <svg x-show="testingAccountLogin !== acc.login" class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                  <div x-show="testingAccountLogin === acc.login" class="w-3.5 h-3.5 border-2 border-slate-400 border-t-brand-600 rounded-full animate-spin"></div>
                  <span x-text="t('test_connection_btn')"></span>
                </button>

                <template x-if="!acc.is_active">
                  <button type="button" @click="activateAccount(acc.login)"
                          class="px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-semibold text-white transition"
                          x-text="t('set_active_btn')">
                  </button>
                </template>

                <button type="button" @click="deleteAccount(acc.login)"
                        class="p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-500 transition"
                        title="Delete">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </template>

          <template x-if="accounts.length === 0">
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-dark-800/50 border border-dashed border-slate-300 dark:border-white/10 text-center text-xs text-slate-500 dark:text-slate-400"
                 x-text="t('no_accounts_registered')">
            </div>
          </template>
        </div>
      </div>

      <!-- Add Account Form -->
      <div class="p-4 rounded-xl bg-slate-50 dark:bg-dark-800 border border-brand-500/30 flex flex-col gap-3">
        <h4 class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
          <i data-lucide="key" class="w-4 h-4 text-brand-600 dark:text-brand-400"></i>
          <span x-text="t('add_account_form_title')"></span>
        </h4>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-semibold text-slate-700 dark:text-slate-300" x-text="t('token_label')"></label>
          <div class="relative flex items-center" dir="ltr">
            <input :type="showTokenInput ? 'text' : 'password'" x-model="newAccountForm.token"
                   placeholder="ghp_xxxxxxxxxxxxxxxxxxxx or github_pat_..."
                   class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl py-2.5 pl-3 pr-10 font-mono text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
            <button type="button" @click="showTokenInput = !showTokenInput" 
                    class="absolute right-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
              <svg x-show="!showTokenInput" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg x-show="showTokenInput" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" x2="22" y1="2" x2="22"></line>
              </svg>
            </button>
          </div>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 leading-normal" x-text="t('token_scope_hint')"></p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1 block" x-text="t('label_label')"></label>
            <input type="text" x-model="newAccountForm.label" :placeholder="t('label_placeholder')"
                   class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
          </div>
          <div class="flex items-end pb-2">
            <label class="flex items-center gap-2 text-xs text-slate-700 dark:text-slate-300 cursor-pointer">
              <input type="checkbox" x-model="newAccountForm.set_active" class="rounded bg-white dark:bg-dark-900 border-slate-300 dark:border-white/20 text-brand-600 focus:ring-0 w-4 h-4">
              <span x-text="t('set_active_immediately')"></span>
            </label>
          </div>
        </div>

        <button type="button" @click="addAccount()" :disabled="isAddingAccount || !newAccountForm.token"
                class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-500 hover:from-brand-500 hover:to-indigo-400 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition">
          <svg x-show="!isAddingAccount" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <polyline points="9 12 11 14 15 10"></polyline>
          </svg>
          <div x-show="isAddingAccount" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span x-text="isAddingAccount ? t('validating_account') : t('save_account_btn')"></span>
        </button>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end border-t border-slate-200 dark:border-white/10 pt-3">
        <button type="button" @click="showAccountsModal = false" class="px-5 py-2 rounded-xl text-xs text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-dark-800 hover:bg-slate-200 dark:hover:bg-dark-700 transition" x-text="t('close_btn')">
        </button>
      </div>

    </div>
  </div>

  <!-- Engine Settings Modal (Local vs OpenHands Cloud) -->
  <div x-show="showEngineModal" x-cloak class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
    <div class="glass max-w-xl w-full p-6 rounded-2xl flex flex-col gap-5 border border-slate-200 dark:border-white/10 my-8 shadow-2xl" @click.outside="showEngineModal = false">
      
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-white/10 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600/10 dark:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-500/30 shrink-0">
            <i data-lucide="sliders" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-900 dark:text-white" x-text="t('engine_modal_title')"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="t('engine_modal_desc')"></p>
          </div>
        </div>
        <button @click="showEngineModal = false" class="text-slate-400 hover:text-slate-900 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="grid grid-cols-2 gap-3 p-1 rounded-xl bg-slate-100 dark:bg-dark-800 border border-slate-200 dark:border-white/10">
        <button type="button" @click="engineForm.mode = 'local'"
                class="py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition"
                :class="engineForm.mode === 'local' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'">
          <i data-lucide="server" class="w-4 h-4"></i>
          <span x-text="t('engine_mode_local')"></span>
        </button>
        <button type="button" @click="engineForm.mode = 'cloud'"
                class="py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition"
                :class="engineForm.mode === 'cloud' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'">
          <i data-lucide="cloud" class="w-4 h-4"></i>
          <span x-text="t('engine_mode_cloud')"></span>
        </button>
      </div>

      <!-- Form Content -->
      <div class="flex flex-col gap-4">
        <template x-if="engineForm.mode === 'local'">
          <div class="flex flex-col gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 block" x-text="t('local_url_label')"></label>
              <input type="text" x-model="engineForm.local_base_url" placeholder="http://127.0.0.1:8000" dir="ltr"
                     class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 block" x-text="t('local_key_label')"></label>
              <input type="password" x-model="engineForm.local_api_key" placeholder="Optional session key" dir="ltr"
                     class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
            </div>
          </div>
        </template>

        <template x-if="engineForm.mode === 'cloud'">
          <div class="flex flex-col gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 block" x-text="t('cloud_url_label')"></label>
              <input type="text" x-model="engineForm.cloud_base_url" placeholder="https://app.all-hands.dev" dir="ltr"
                     class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 block" x-text="t('cloud_key_label')"></label>
              <input type="password" x-model="engineForm.cloud_api_key" placeholder="oh_api_pat_..." dir="ltr"
                     class="w-full bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 shadow-sm">
            </div>
          </div>
        </template>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-between border-t border-slate-200 dark:border-white/10 pt-4">
        <button type="button" @click="testEngineConnection()" :disabled="isTestingEngine"
                class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-dark-800 hover:bg-slate-200 dark:hover:bg-dark-700 text-xs text-slate-700 dark:text-slate-300 flex items-center gap-1.5 transition">
          <svg x-show="!isTestingEngine" class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <div x-show="isTestingEngine" class="w-4 h-4 border-2 border-slate-400 border-t-brand-600 rounded-full animate-spin"></div>
          <span x-text="t('test_connection_btn')"></span>
        </button>

        <div class="flex items-center gap-2">
          <button type="button" @click="showEngineModal = false" class="px-4 py-2 rounded-xl text-xs text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" x-text="t('cancel_btn')"></button>
          <button type="button" @click="saveEngineConfig()"
                  class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 transition" x-text="t('save_engine_btn')">
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Live Agent Console & Interactive Chat Drawer -->
  <div x-show="showConsoleDrawer" x-cloak class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-start">
    <div class="w-full max-w-4xl bg-white dark:bg-dark-900 border-l border-slate-200 dark:border-white/10 h-full flex flex-col shadow-2xl transition-all duration-300" @click.outside="closeConsoleDrawer()">
      
      <!-- Drawer Top Header -->
      <div class="p-4 border-b border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-dark-800/80 flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-brand-600/10 dark:bg-brand-600/20 text-brand-600 dark:text-brand-400 flex items-center justify-center border border-brand-500/30 shrink-0">
            <i data-lucide="terminal" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white" x-text="t('console_title')"></h3>
              <!-- Live status badge -->
              <template x-if="activeConversation">
                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider"
                      :class="{
                        'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30 animate-pulse': activeConversation.status === 'running',
                        'bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/30': activeConversation.status === 'paused',
                        'bg-slate-200 dark:bg-slate-700/40 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-600/30': activeConversation.status === 'finished',
                        'bg-rose-500/20 text-rose-700 dark:text-rose-300 border border-rose-500/30': activeConversation.status === 'error' || activeConversation.status === 'interrupted'
                      }"
                      x-text="activeConversation.status || 'running'"></span>
              </template>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5" x-text="t('console_subtitle')"></p>
          </div>
        </div>

        <!-- Controls: Interrupt, Run, OpenHands UI, Close -->
        <div class="flex items-center gap-2">
          <!-- Emergency Interrupt Button -->
          <button type="button" @click="interruptAgent()" :disabled="isInterrupting || !activeConversationId"
                  class="px-3 py-1.5 rounded-xl bg-rose-600/10 dark:bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-rose-600 dark:text-rose-300 hover:text-white text-xs font-bold flex items-center gap-1.5 transition shadow-sm"
                  :title="t('console_interrupt_btn')">
            <i data-lucide="octagon-alert" class="w-4 h-4 text-rose-500"></i>
            <span x-text="t('console_interrupt_btn')"></span>
          </button>

          <!-- Resume / Run Button -->
          <button type="button" @click="resumeAgent()" :disabled="!activeConversationId"
                  class="px-3 py-1.5 rounded-xl bg-emerald-600/10 dark:bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/40 text-emerald-600 dark:text-emerald-300 hover:text-white text-xs font-bold flex items-center gap-1.5 transition shadow-sm"
                  :title="t('console_resume_btn')">
            <i data-lucide="play" class="w-4 h-4 text-emerald-500"></i>
            <span x-text="t('console_resume_btn')"></span>
          </button>

          <!-- Refresh button -->
          <button type="button" @click="fetchEvents(activeConversationId)" 
                  class="p-2 rounded-xl bg-slate-100 dark:bg-dark-700 hover:bg-slate-200 dark:hover:bg-dark-600 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
            <i data-lucide="refresh-cw" class="w-4 h-4" :class="isEventsLoading ? 'animate-spin text-brand-500' : ''"></i>
          </button>

          <!-- Open in Web UI -->
          <a :href="getOpenHandsWebUrl(activeConversationId)" target="_blank"
             class="p-2 rounded-xl bg-slate-100 dark:bg-dark-700 hover:bg-slate-200 dark:hover:bg-dark-600 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition"
             :title="t('console_openhands_link')">
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>

          <!-- Close drawer -->
          <button type="button" @click="closeConsoleDrawer()" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Conversation Selector Bar -->
      <div class="px-4 py-2 bg-slate-100 dark:bg-dark-800/40 border-b border-slate-200 dark:border-white/5 flex items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2 flex-1">
          <span class="text-slate-500 dark:text-slate-400 shrink-0 font-medium" x-text="t('active_conversation_label')"></span>
          <select x-model="activeConversationId" @change="selectConversation(activeConversationId)"
                  class="bg-white dark:bg-dark-900 border border-slate-200 dark:border-white/10 rounded-lg px-2.5 py-1 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 max-w-md w-full shadow-sm">
            <template x-for="conv in openhandsConversations" :key="conv.id">
              <option :value="conv.id" x-text="conv.title + ' (' + conv.status + ')'" :selected="conv.id === activeConversationId"></option>
            </template>
          </select>
        </div>
        <span class="font-mono text-[10px] text-slate-400 dark:text-slate-500" x-text="activeConversationId"></span>
      </div>

      <!-- Body: Event Log Stream -->
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 font-sans" id="consoleEventsContainer">
        <template x-if="isEventsLoading && conversationEvents.length === 0">
          <div class="flex flex-col items-center justify-center h-full gap-3 text-slate-400">
            <div class="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs" x-text="t('console_loading')"></span>
          </div>
        </template>

        <template x-if="conversationEvents.length === 0 && !isEventsLoading">
          <div class="flex flex-col items-center justify-center h-full gap-2 text-slate-400">
            <svg class="w-8 h-8 text-slate-400 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
              <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
            </svg>
            <span class="text-xs" x-text="t('console_empty')"></span>
          </div>
        </template>

        <!-- Stream items -->
        <template x-for="evt in conversationEvents" :key="evt.id">
          <div class="flex flex-col rounded-xl border transition-all text-xs overflow-hidden shrink-0 shadow-sm"
               style="flex-shrink: 0;"
               :class="{
                 'bg-white dark:bg-dark-800/90 border-slate-200 dark:border-indigo-500/30': evt.type === 'command',
                 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-white/5': evt.type === 'output',
                 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 dark:border-rose-600/40': evt.type === 'error',
                 'bg-purple-50 dark:bg-brand-950/20 border-purple-200 dark:border-brand-500/30': evt.type === 'thought',
                 'bg-emerald-50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-500/30': evt.type === 'finish',
                 'bg-indigo-50 dark:bg-indigo-950/40 border-indigo-200 dark:border-indigo-500/40': evt.type === 'user_message',
                 'bg-indigo-50/50 dark:bg-purple-950/30 border-slate-200 dark:border-purple-500/40': evt.type === 'agent_message'
               }">
            
            <!-- Event Header -->
            <div class="px-3 py-2 flex items-center justify-between bg-slate-50/80 dark:bg-white/[0.02] border-b border-slate-200 dark:border-white/5 text-[11px]">
              <div class="flex items-center gap-2">
                <!-- Icon by type -->
                <svg x-show="evt.type === 'command'" class="w-3.5 h-3.5 text-indigo-500 dark:text-indigo-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                <svg x-show="evt.type === 'output'" class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <line x1="10" y1="9" x2="8" y2="9"></line>
                </svg>
                <svg x-show="evt.type === 'error'" class="w-3.5 h-3.5 text-rose-500 dark:text-rose-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <svg x-show="evt.type === 'thought'" class="w-3.5 h-3.5 text-purple-500 dark:text-purple-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
                  <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
                </svg>
                <svg x-show="evt.type === 'user_message'" class="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <svg x-show="evt.type === 'agent_message'" class="w-3.5 h-3.5 text-indigo-500 dark:text-indigo-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M12 8V4H8"></path>
                  <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                  <path d="M2 14h2"></path>
                  <path d="M20 14h2"></path>
                  <path d="M15 13v2"></path>
                  <path d="M9 13v2"></path>
                </svg>

                <span class="font-bold text-slate-800 dark:text-slate-200" x-text="evt.title"></span>
              </div>
              <span class="font-mono text-[10px] text-slate-400 dark:text-slate-500" x-text="formatTimestamp(evt.timestamp)"></span>
            </div>

            <!-- Thought (if present) -->
            <template x-if="evt.thought && evt.type !== 'thought'">
              <div class="px-3 py-2 bg-purple-50/60 dark:bg-purple-950/20 border-b border-purple-200 dark:border-white/5 text-[11px] text-purple-900 dark:text-purple-200/90 leading-relaxed">
                <div class="flex items-center gap-1 font-semibold text-purple-700 dark:text-purple-300 text-[10px] mb-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
                    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
                  </svg>
                  <span x-text="t('agent_thought_label')"></span>
                </div>
                <p class="whitespace-pre-wrap font-sans" x-text="evt.thought"></p>
              </div>
            </template>

            <!-- Event Content / Body -->
            <div class="p-3">
              <template x-if="evt.type === 'command'">
                <div class="font-mono text-[11px] text-emerald-400 bg-slate-900 p-2.5 rounded-lg border border-slate-800 overflow-x-auto shadow-inner" dir="ltr" x-text="evt.content"></div>
              </template>

              <template x-if="evt.type === 'output' || evt.type === 'error'">
                <pre class="font-mono text-[11px] p-2.5 rounded-lg bg-slate-900 border border-slate-800 max-h-48 overflow-y-auto whitespace-pre-wrap leading-tight shadow-inner"
                     :class="evt.type === 'error' ? 'text-rose-400' : 'text-slate-300'"
                     dir="ltr" x-text="evt.content || '(no text output)'"></pre>
              </template>

              <template x-if="evt.type === 'thought'">
                <p class="font-sans text-xs text-purple-900 dark:text-purple-200 whitespace-pre-wrap leading-relaxed" x-text="evt.content"></p>
              </template>

              <template x-if="evt.type === 'user_message'">
                <div class="text-xs leading-relaxed whitespace-pre-wrap text-emerald-800 dark:text-emerald-200 font-medium"
